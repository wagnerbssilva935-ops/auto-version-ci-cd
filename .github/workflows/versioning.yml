name: Versioning
on:
  push:
    branches: [ "main" ]

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ler e incrementar versao
        run: |
          echo "Versao atual:"
          cat version.txt
          CURRENT=$(cat version.txt | tr -d 'v\r\n')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="v${MAJOR}.${MINOR}.${NEW_PATCH}"
          echo "Nova versao: $NEW_VERSION"
          echo "$NEW_VERSION" > version.txt

      - name: Commit e Push da nova versao
        run: |
          git config user.name "CI Bot"
          git config user.email "ci-bot@example.com"
          git add version.txt
          git commit -m "chore: bump version para $(cat version.txt) [skip ci]" || echo "Sem alteracoes"
          git push
